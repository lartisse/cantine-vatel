<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d1d1b">
    <title>Hors ligne · Cantine de Vatel</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        body { background: var(--bg); padding: 20px 16px; }
        .wrap { max-width: 460px; margin: 0 auto; text-align: center; }
        .qr-box { margin-top: 14px; text-align: center; }
        .qr-box .q { display: flex; justify-content: center; margin: 12px 0 6px; }
        .items { font-size: 13px; color: var(--muted); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="/img/vatel_logo.png" alt="Vatel" style="height:56px;margin:0 auto 14px">
        <h1 style="font-size:22px">Vous êtes hors ligne</h1>
        <p class="muted mt small">Les pages déjà consultées (menu, réservations) restent accessibles. Présentez votre QR code ou donnez le code de secours au comptoir.</p>
        <div id="qrs"></div>
        <button class="btn mt" onclick="location.reload()">Réessayer</button>
        <p class="xs muted mt">Les QR codes sont enregistrés sur cet appareil à chaque visite de l’application et effacés à la déconnexion.</p>
    </div>
    <script src="/vendor/qrcode.min.js"></script>
    <script>
        (function () {
            var box = document.getElementById('qrs');
            var today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
            var list = [];
            try {
                Object.keys(localStorage).filter(function (k) { return k.indexOf('cv:resa-') === 0; }).forEach(function (k) {
                    try { var r = JSON.parse(localStorage.getItem(k)); if (r && r.iso && r.iso >= today) list.push(r); } catch (e) {}
                });
            } catch (e) {}
            list.sort(function (a, b) { return a.iso < b.iso ? -1 : 1; });
            if (!list.length) {
                box.innerHTML = '<div class="card mt"><p class="small muted">Aucun QR code de réservation enregistré sur cet appareil.</p></div>';
                return;
            }
            list.forEach(function (r) {
                var card = document.createElement('div');
                card.className = 'qr-box';
                var title = document.createElement('b'); title.textContent = r.date + ' · créneau ' + r.slot; card.appendChild(title);
                var q = document.createElement('div'); q.className = 'q'; card.appendChild(q);
                var code = document.createElement('div'); code.className = 'qr-code-text'; code.textContent = r.code; card.appendChild(code);
                var hint = document.createElement('p'); hint.className = 'xs muted'; hint.textContent = 'Code de secours à donner au comptoir'; card.appendChild(hint);
                if (r.items && r.items.length) { var it = document.createElement('div'); it.className = 'items'; it.textContent = r.items.join(', '); card.appendChild(it); }
                box.appendChild(card);
                if (window.QRCode) new QRCode(q, { text: r.qr, width: 200, height: 200 });
            });
        })();
    </script>
</body>
</html>
